<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF8F5" />
    <title>Sei offline · Beach Volley Diary</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #faf8f5;
        color: #1b2a4a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .box { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
      p { margin: 0; font-size: 15px; line-height: 1.6; color: rgba(27, 42, 74, 0.65); }
      button {
        margin-top: 6px;
        padding: 13px 26px;
        border: 0;
        border-radius: 12px;
        background: #ff6b35;
        color: #fff;
        font: 600 15px system-ui, sans-serif;
        cursor: pointer;
      }
      button:hover { background: #c4501e; }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icons/icon-192.png" width="76" height="76" alt="" style="border-radius: 18px" />
      <h1>Sei offline</h1>
      <p>
        Il diario ha bisogno della rete per caricare tornei e statistiche. Torna
        online e riprova.
      </p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </div>
  </body>
</html>
