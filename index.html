<!doctype html>
<html lang="it">
  <head>
    <!-- `charset` per primo: la specifica vuole che sia dichiarato entro i primi
         1024 byte, e qualunque cosa messa sopra consuma quel budget. -->
    <meta charset="UTF-8" />
    <!-- Clarity non sta più qui: è inizializzato da src/main.tsx via il pacchetto
         @microsoft/clarity, così il bootstrap è codice dell'app e non uno script
         inline da autorizzare a parte nella CSP. -->

    <!-- Favicon inline: il marchio del redesign nella sua tessera d'inchiostro —
         il pallone bianco con la fascia arancio, lo stesso disegno di BrandMark
         (src/components/Logo.tsx). La tessera lo fa leggere sulle schede chiare
         e su quelle scure. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%231C1C1E%22/><g transform=%22translate(32 32) scale(0.72)%22><clipPath id=%22p%22><circle r=%2230%22/></clipPath><circle r=%2230%22 fill=%22%23FFFFFF%22/><path d=%22M-34 -14 C-12 -30 16 -30 34 -12%22 clip-path=%22url(%23p)%22 stroke=%22%23FF6B1A%22 stroke-width=%2210%22 fill=%22none%22/><circle r=%2230%22 fill=%22none%22 stroke=%22%23FFFFFF%22 stroke-width=%223%22/></g></svg>"
    />
    <!-- `viewport-fit=cover`: TabBar, NavBar, sheet e visori arrivano fino ai
         bordi dello schermo e si scostano da soli con `env(safe-area-inset-*)`.
         Niente `maximum-scale`: lo zoom resta libero (UX §8.8). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Un solo colore, quello del fondo dove sta la barra di stato (--bg):
         la dark mode non c'è in questo giro (UX C17, ART_DIRECTION D11). -->
    <meta name="theme-color" content="#F6F6F4" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- PWA: il manifest è condiviso con la landing (/presentazione), che è il
         posto da cui si installa. `start_url` punta qui, così l'icona in Home
         apre direttamente il diario. Il service worker lo registra la landing. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Beach Diary" />
    <title>Beach Diary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
